name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 完整历史，用于归纳版本间提交

      # bgd_appsdk 是 path 依赖，检出到工作区内子目录（私有仓库用 PAT），构建前改写路径
      - uses: actions/checkout@v6
        with:
          repository: woaye168/bgd_sce_appsdk
          path: bgd_sce_appsdk
          token: ${{ secrets.BGD_CROSS_REPO_PAT }}

      - name: Generate release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $prev = git tag --sort=-v:refname | Where-Object { $_ -ne $tag } | Select-Object -First 1
          $range = if ($prev) { "$prev..$tag" } else { "$tag" }
          $commits = git log $range --pretty=format:"- %s (``%h``)" --no-merges
          $lines = @()
          $lines += "## 版本说明"
          $lines += ""
          if ($prev) { $lines += "本版本相对 ``$prev`` 的全部变更如下：" } else { $lines += "首个版本，包含全部提交：" }
          $lines += ""
          $lines += "### What's Changed"
          $lines += ""
          if ($commits) { $lines += $commits } else { $lines += "- 无代码变更" }
          $lines += ""
          if ($prev) { $lines += "**Full Changelog**: https://github.com/$repo/compare/$prev...$tag" }
          $body = $lines -join "`n"
          "body<<EOF" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "EOF" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
        id: notes

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # 版本号唯一来源是 git tag：构建前把 tag 版本注入 Cargo.toml
      # 源码中的 version 固定为 0.0.0-dev 占位，无需手工同步
      #（必须在 dotnet build 之前：bgd_mcp_bridge.dll 的 -p:Version 也用同一版本，
      #  Rust 侧 env!("CARGO_PKG_VERSION") 生成 sce.deps.json 登记键，二者必须一致）
      - name: Inject version from tag
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          Write-Output "注入版本号: $ver"
          $cargo = Get-Content Cargo.toml -Raw
          $cargo = $cargo -replace '(?m)^version = "[^"]*"', "version = `"$ver`""
          Set-Content Cargo.toml $cargo -NoNewline -Encoding utf8
          # bgd_appsdk path 依赖：本地为 ../bgd_sce_plugins，CI 检出在 bgd_sce_appsdk 子目录
          $cargo = $cargo -replace 'path = "\.\./bgd_sce_plugins"', 'path = "bgd_sce_appsdk"'
          Set-Content Cargo.toml $cargo -NoNewline -Encoding utf8
          Write-Output "已写入 Cargo.toml"
          "ver=$ver" | Out-File $env:GITHUB_OUTPUT -Append
        id: ver

      # C# 桥接程序集（bgd_mcp_bridge）：引用程序集用仓库 ci/refs/ 副本（宿主 version-13 自带 dll）
      # -p:Version 注入 tag 版本（csproj 占位 0.0.0-dev），dll 版本跟随插件版本
      - name: Build bgd_mcp_bridge (.NET)
        run: dotnet build csharp/bgd_mcp_bridge -c Release -p:Platform=x64 -p:SceHostDir=ci/refs -p:Version=${{ steps.ver.outputs.ver }}

      # 不用 --locked：上一步注入了版本号到 Cargo.toml，Cargo.lock 需同步更新
      - name: Build release
        run: cargo build --release

      # CI 合成发布元数据 asset app-release.json（静态 app.json + 版本 + 版本说明；
      # 宿主应用市场凭它展示版本/描述/版本说明，registry 无需随版本改动）
      - name: Generate app-release.json
        shell: pwsh
        run: |
          $meta = Get-Content app.json -Raw -Encoding utf8 | ConvertFrom-Json
          $meta | Add-Member -NotePropertyName version -NotePropertyValue ("${{ github.ref_name }}".TrimStart('v'))
          $meta | Add-Member -NotePropertyName release_notes -NotePropertyValue @'
${{ steps.notes.outputs.body }}
'@
          $meta | ConvertTo-Json -Depth 5 | Set-Content app-release.json -Encoding utf8

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: sce_app_editor-patch ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false
          files: |
            target/release/sce_app_editor-patch.exe
            app-release.json
